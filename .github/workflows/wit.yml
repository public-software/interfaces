# The WIT package under wit/: fetched, parsed and built on every change; published to ghcr.io on a
# release tag (RFC-0002). suite / * (ci.yml) still runs; this workflow is the package's own check.
name: wit
on:
  push:
    branches: [main]
    tags: ["core-v*"]
  pull_request:
  merge_group:
permissions:
  contents: read
env:
  WASM_TOOLS_VERSION: 1.258.0
  WKG_VERSION: 0.16.1
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install wasm-tools and wkg, pinned releases
        run: bash .github/wit-tools.sh
      - name: Fetch the WASI packages the world imports (wit/deps, wkg.lock)
        run: wkg wit fetch
      - name: Parse
        run: wasm-tools component wit wit/
      - name: Build
        run: wkg wit build --wit-dir wit -o core.wasm
      - name: The package the build declares
        id: package
        run: |
          set -euo pipefail
          package="$(wasm-tools component wit core.wasm | sed -n 's/^package \([^;]*\);.*/\1/p' | head -n 1)"
          case "$package" in
            "public:core@"*) echo "version=${package#*@}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::built $package, expected public:core@<version>"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: core.wasm, path: core.wasm, if-no-files-found: error }
  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # the OCI artifact
      id-token: write       # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: core.wasm }
      - name: The tag names the version the package declares
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ "$TAG" = "core-v$VERSION" ] || { echo "::error::tag $TAG, but the package is $VERSION"; exit 1; }
      - name: Install wkg, pinned release
        run: bash .github/wit-tools.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to ghcr.io/public-software/public/core:<version>
        run: wkg publish --config .wkg/config.toml core.wasm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: core.wasm }
